<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Hebrew:wdth,wght@62.5..100,100..900&display=block" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Rashi+Hebrew:wght@100..900&display=block" rel="stylesheet">
<style>
body{margin:0;background:#f6f4ea;color:#3d4954;padding:20px}
.row{display:flex;align-items:center;gap:30px;border-bottom:1px solid #ddd;padding:6px 0}
.n{font:12px Arial;width:230px;color:#888;direction:ltr;text-align:left}
.t{font-size:96px;line-height:1.3}
</style></head><body>
<div class="row"><span class="n">A1 cond 100, nib 3px vertical</span><span class="t nib" data-dx="0.15" data-dy="1" data-n="3" style="font-family:'Noto Serif Hebrew';font-weight:100;font-stretch:62.5%">חשמלאי מוסמך</span></div>
<div class="row"><span class="n">A2 cond 100, nib 4.5px 20deg</span><span class="t nib" data-dx="-0.35" data-dy="1" data-n="4.5" style="font-family:'Noto Serif Hebrew';font-weight:100;font-stretch:62.5%">חשמלאי מוסמך</span></div>
<div class="row"><span class="n">A3 width 75, 100, nib 4px</span><span class="t nib" data-dx="-0.3" data-dy="1" data-n="4" style="font-family:'Noto Serif Hebrew';font-weight:100;font-stretch:75%">חשמלאי מוסמך</span></div>
<div class="row"><span class="n">A4 cond 100, nib 5px + skew</span><span class="t nib" data-dx="-0.3" data-dy="1" data-n="5" style="font-family:'Noto Serif Hebrew';font-weight:100;font-stretch:62.5%;display:inline-block;transform:skewX(8deg)">חשמלאי מוסמך</span></div>
<div class="row"><span class="n">D2 Rashi 100, nib 3px</span><span class="t nib" data-dx="0.35" data-dy="1" data-n="3" style="font-family:'Noto Rashi Hebrew';font-weight:100">חשמלאי מוסמך</span></div>
<script>
document.fonts.ready.then(()=>{
  document.querySelectorAll('.nib').forEach(el=>{
    const dx=+el.dataset.dx, dy=+el.dataset.dy, n=+el.dataset.n, s=[];
    for(let i=1;i<=n*4;i++){const k=i/4; s.push(`${(dx*k).toFixed(2)}px ${(dy*k).toFixed(2)}px 0 currentColor`);}
    el.style.textShadow=s.join(',');
  });
});
</script>
</body></html>
